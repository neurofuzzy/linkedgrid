<!DOCTYPE html>
<html class="dark">
<head>
  <title>Spartan Visual Test Runner</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            entity: {
              player: '#4a90e2',
              enemy: '#e24a4a',
              item: '#f5d142',
              projectile: '#9b59b6',
              wall: '#7f8c8d',
            }
          }
        }
      }
    }
  </script>
  <style>
    #grid td {
      width: 32px;
      height: 32px;
    }
    .entity-player { background: #4a90e2; }
    .entity-enemy { background: #e24a4a; }
    .entity-item { background: #f5d142; color: #1f2937; }
    .entity-projectile { background: #9b59b6; }
    .entity-wall { background: #7f8c8d; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-mono">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
      <div class="p-4 border-b border-gray-700">
        <h1 class="text-lg font-semibold flex items-center gap-2">
          <i data-lucide="play-circle" class="w-5 h-5"></i>
          Visual Tests
        </h1>
      </div>
      <div id="test-list" class="flex-1 overflow-y-auto"></div>
    </aside>
    
    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- Controls -->
      <div id="controls" class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="flex items-center gap-3">
          <button id="step" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg flex items-center gap-2 transition-colors">
            <i data-lucide="step-forward" class="w-4 h-4"></i>
            Step
          </button>
          <button id="play" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg flex items-center gap-2 transition-colors">
            <i data-lucide="play" class="w-4 h-4"></i>
            Play
          </button>
          <button id="stop" disabled class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg flex items-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            <i data-lucide="square" class="w-4 h-4"></i>
            Stop
          </button>
          <div class="flex items-center gap-2 ml-4">
            <i data-lucide="timer" class="w-4 h-4 text-gray-400"></i>
            <input type="number" id="interval" value="500" min="100" step="100" 
                   class="w-20 px-2 py-1 bg-gray-700 border border-gray-600 rounded text-sm">
            <span class="text-sm text-gray-400">ms</span>
          </div>
          <div id="info" class="ml-auto text-sm text-gray-400"></div>
        </div>
      </div>
      
      <!-- Grid -->
      <div class="flex-1 overflow-auto p-8">
        <div id="grid" class="inline-block bg-gray-800 p-6 rounded-lg border border-gray-700"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { LinkedGrid } from '/packages/grid/linked-grid.ts';
    import { SparseEntityStore } from '/packages/spartan/entity-store.ts';
    import { SpatialSystem } from '/packages/spartan/spatial-system.ts';

    // State
    let snapshots = [];
    let currentIdx = 0;
    let playInterval = null;
    let currentSpatial = null;
    let currentGrid = null;

    // Initialize global test array
    window.visualTests = [];
    
    // Load all visual test files
    async function loadTests() {
      const modules = import.meta.glob('/packages/spartan/test/*.visual.test.ts');
      for (const path in modules) {
        await modules[path]();
      }
      renderSidebar();
    }

    function renderSidebar() {
      const list = document.getElementById('test-list');
      if (window.visualTests.length === 0) {
        list.innerHTML = '<div class="p-4 text-gray-500 text-sm">No visual tests found</div>';
        return;
      }
      
      list.innerHTML = window.visualTests.map((t, i) => 
        `<div class="test-item px-4 py-3 cursor-pointer hover:bg-gray-700 border-b border-gray-700 transition-colors text-sm" data-idx="${i}">
          <i data-lucide="circle" class="w-3 h-3 inline mr-2"></i>${t.name}
        </div>`
      ).join('');
      
      list.querySelectorAll('.test-item').forEach(el => {
        el.addEventListener('click', () => runTest(parseInt(el.dataset.idx)));
      });
      
      lucide.createIcons();
    }

    // Capture snapshot after spatial operation
    function captureSnapshot(spatial, operation, args, result) {
      const entities = [];
      const grid = spatial.getGrid();
      
      for (let y = 0; y < grid.height; y++) {
        for (let x = 0; x < grid.width; x++) {
          const ids = spatial.getEntityIdsInCell(x, y);
          ids.forEach(id => {
            const data = spatial.getEntityData(id);
            if (data) {
              entities.push({ id, type: data.type, x, y });
            }
          });
        }
      }
      
      snapshots.push({ 
        operation, 
        args, 
        result, 
        entities, 
        grid: { w: grid.width, h: grid.height } 
      });
    }

    // Wrap SpatialSystem to intercept operations
    function wrapSpatial(spatial) {
      return new Proxy(spatial, {
        get: (target, prop) => {
          if (typeof target[prop] !== 'function') return target[prop];
          
          return (...args) => {
            const result = target[prop].apply(target, args);
            
            // Capture snapshots for spatial operations
            if (['spawn', 'move', 'remove'].includes(prop)) {
              captureSnapshot(target, prop, args, result);
            }
            
            return result;
          };
        }
      });
    }

    // Run selected test
    async function runTest(idx) {
      const test = window.visualTests[idx];
      if (!test) return;
      
      // Reset state
      snapshots = [];
      currentIdx = 0;
      stopPlay();
      
      // Setup fresh grid and spatial system
      currentGrid = new LinkedGrid(20, 20);
      const store = new SparseEntityStore();
      currentSpatial = new SpatialSystem(currentGrid, store);
      const wrappedSpatial = wrapSpatial(currentSpatial);
      
      // Capture initial state
      captureSnapshot(currentSpatial, 'initial', [], null);
      
      // Run test function
      try {
        await test.fn({ grid: currentGrid, spatial: wrappedSpatial, store });
      } catch (error) {
        console.error('Test error:', error);
        document.getElementById('info').textContent = `Error: ${error.message}`;
        return;
      }
      
      // Highlight active test in sidebar
      document.querySelectorAll('.test-item').forEach((el, i) => {
        if (i === idx) {
          el.classList.add('bg-blue-600', 'text-white');
          el.classList.remove('hover:bg-gray-700');
        } else {
          el.classList.remove('bg-blue-600', 'text-white');
          el.classList.add('hover:bg-gray-700');
        }
      });
      
      // Render first snapshot
      renderSnapshot();
    }

    // Render current snapshot
    function renderSnapshot() {
      if (snapshots.length === 0) {
        document.getElementById('grid').innerHTML = '<p class="text-gray-500">No snapshots</p>';
        return;
      }
      
      const snap = snapshots[currentIdx];
      const { w, h } = snap.grid;
      
      // Build HTML table for grid
      let html = '<table class="border-collapse">';
      for (let y = 0; y < h; y++) {
        html += '<tr>';
        for (let x = 0; x < w; x++) {
          const entity = snap.entities.find(e => e.x === x && e.y === y);
          const cls = entity ? `entity-${entity.type}` : 'bg-gray-900 border border-gray-700';
          const content = entity ? entity.type[0].toUpperCase() : '';
          html += `<td class="${cls} text-white text-xs font-bold text-center">${content}</td>`;
        }
        html += '</tr>';
      }
      html += '</table>';
      
      document.getElementById('grid').innerHTML = html;
      
      // Update info text
      const argsStr = snap.args.length > 0 ? snap.args.join(', ') : '';
      document.getElementById('info').innerHTML = 
        `<i data-lucide="layers" class="w-4 h-4 inline"></i> ${currentIdx + 1}/${snapshots.length} - <span class="text-blue-400">${snap.operation}</span>(${argsStr})`;
      lucide.createIcons();
    }

    // Step to next snapshot
    function step() {
      if (currentIdx < snapshots.length - 1) {
        currentIdx++;
        renderSnapshot();
      }
    }

    // Start auto-play
    function play() {
      if (playInterval) return;
      if (snapshots.length === 0) return;
      
      const interval = parseInt(document.getElementById('interval').value);
      document.getElementById('play').disabled = true;
      document.getElementById('stop').disabled = false;
      
      playInterval = setInterval(() => {
        step();
        if (currentIdx >= snapshots.length - 1) {
          stopPlay();
        }
      }, interval);
    }

    // Stop auto-play
    function stopPlay() {
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
      }
      document.getElementById('play').disabled = false;
      document.getElementById('stop').disabled = true;
    }

    // Wire up controls
    document.getElementById('step').addEventListener('click', step);
    document.getElementById('play').addEventListener('click', play);
    document.getElementById('stop').addEventListener('click', stopPlay);

    // Load tests on startup and initialize icons
    loadTests().then(() => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
