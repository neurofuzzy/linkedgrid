<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spartan Playground - Interactive Runtime</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Lexend:wght@100..900&family=Saira:ital,wght@0,100..900;1,100..900&family=Sixtyfour&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Font Classes */
      .saira-regular {
        font-family: 'Saira', sans-serif;
        font-weight: 400;
      }

      .lexend-regular {
        font-family: 'Lexend', sans-serif;
        font-weight: 400;
      }

      .sixtyfour-regular {
        font-family: 'Sixtyfour', sans-serif;
        font-weight: 400;
      }

      .doto-black {
        font-family: 'Doto', sans-serif;
        font-weight: 900;
      }

      body {
        font-family: 'Lexend', 'Monaco', 'Courier New', monospace;
        background: #0a0a12; /* Softer dark background */
        color: #9ab;
        padding: 20px;
        overflow: hidden;
      }

      #root {
        max-width: 1400px;
        margin: 0 auto;
      }

      h1 {
        font-family: 'Doto', sans-serif;
        font-size: 38px;
        margin-bottom: 25px;
        color: #3399cc; /* Desaturated Neon Pink */
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .grid {
        display: inline-grid;
        gap: 0;
        background: #000000;
        padding: 10px;
        border: 2px solid #222;
        border-radius: 2px;
        margin-bottom: 10px;
      }

      .cell {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-family: 'Sixtyfour', monospace;
        font-weight: normal;
      }

      /* Softened Retro Entity Colors */
      .entity-player {
        color: #33cccc; /* Desaturated Cyan */
      }
      .entity-enemy {
        color: #cc3366; /* Desaturated Neon Red */
      }
      .entity-wall {
        color: #7777cc; /* Desaturated Arcade Blue */
      }
      .entity-teleporter {
        color: #9d33cc; /* Desaturated Purple */
      }
      .entity-item {
        color: #cccc33; /* Desaturated Yellow */
      }
      .entity-projectile {
        color: #cc8833; /* Desaturated Orange */
      }
      .entity-door {
        color: #33b5cc;
      }
      .entity-open-door {
        color: #225555;
      }

      .empty {
        color: #1a1a1a;
      }

      /* UI Panels */
      .debug-panel {
        margin-top: 20px;
        padding: 15px;
        background: #0f0f1a;
        border: 1px solid #222;
        border-left: 4px solid #333344;
        border-radius: 0;
      }

      .debug-panel h3 {
        font-family: 'Sixtyfour', sans-serif;
        color: #cccc33;
        margin-bottom: 15px;
        font-size: 14px;
        text-transform: uppercase;
      }

      .debug-panel p {
        margin: 5px 0;
        font-size: 14px;
        color: #9ab;
      }

      .debug-panel .label {
        color: #006699;
        font-weight: bold;
      }

      .controls {
        margin-top: 20px;
        padding: 15px;
        background: #0f0f1a;
        border: 1px solid #222;
        border-left: 4px solid #33cccc;
        border-radius: 0;
      }

      .controls h3 {
        font-family: 'Sixtyfour', sans-serif;
        color: #cccc33;
        margin-bottom: 15px;
        font-size: 14px;
        text-transform: uppercase;
      }

      .controls kbd {
        background: #1a1a2a;
        padding: 4px 8px;
        border: 1px solid #333;
        border-bottom: 3px solid #333;
        border-radius: 2px;
        font-family: 'Lexend', monospace;
        font-size: 12px;
        color: #ccc;
      }

      .scene-info {
        margin-top: 10px;
        padding: 10px;
        background: #0f0f1a;
        border-left: 3px solid #333344;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dev/playground.tsx"></script>
  </body>
</html>
